apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/baba-faisal/gitops.git
    targetRevision: main
    path: argocd              # <-- watches this folder
    directory:
      recurse: true
      exclude: 'root.yaml'    # don't include itself
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
