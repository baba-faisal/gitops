apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: main-service-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/baba-faisal/gitops.git
    targetRevision: main
    path: helm/microservice
    helm:
      valueFiles:
        - ../values/main-service-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true      # <-- this replaces kubectl create namespace
    automated:
      prune: true
      selfHeal: true
